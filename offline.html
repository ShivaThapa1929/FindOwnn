<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Findownn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c09;
      color: #e8f5e9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #22c55e;
      color: #080c09;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>We're unavailable right now without an internet connection. Previously viewed pages and cached playground data may still work when you go back.</p>
    <a href="./" onclick="location.reload();return false;">Try Again</a>
  </div>
</body>
</html>
