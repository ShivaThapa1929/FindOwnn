# VPS / dedicated server — public HTTPS via nginx/caddy in front
services:
  openwa:
    build: .
    image: findownn-openwa:latest
    container_name: findownn-openwa
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      ENGINE_TYPE: baileys
      WWEBJS_AUTH_TIMEOUT_MS: "120000"
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  openwa_data:
