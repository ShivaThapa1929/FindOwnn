# Render.com — New → Blueprint → connect repo
# URL: https://findownn-openwa.onrender.com
#
# IMPORTANT: Free tier (~512MB RAM) cannot run Chromium (whatsapp-web.js).
# Use ENGINE_TYPE=baileys — no browser, works on Render free.

services:
  - type: web
    name: findownn-openwa
    runtime: docker
    dockerfilePath: ./admin/deploy/openwa/Dockerfile
    dockerContext: ./admin/deploy/openwa
    plan: free
    healthCheckPath: /api/health
    disk:
      name: openwa-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "2785"
      # Required on Render free — Chromium OOM causes HTTP 502 + stuck "Starting..."
      - key: ENGINE_TYPE
        value: baileys
      - key: WWEBJS_AUTH_TIMEOUT_MS
        value: "120000"
      - key: NODE_ENV
        value: production
