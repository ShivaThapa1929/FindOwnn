<!DOCTYPE html>
<html>
<head>
    <title>Direct Image Upload Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #0d1612; color: #f0fdf4; }
        .container { max-width: 600px; margin: 0 auto; }
        input, select, button { margin: 10px 0; padding: 10px; width: 100%; }
        button { background: #22c55e; color: #0d1612; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #16a34a; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #22c55e; border-radius: 8px; }
        .success { background: rgba(34, 197, 94, 0.1); }
        .error { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
        pre { background: #000; padding: 10px; overflow: auto; max-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Direct Image Upload Test</h1>
        <p>This tests image upload directly without going through the full UI.</p>
        
        <form id="uploadForm">
            <div>
                <label>Venue ID:</label>
                <input type="number" id="venue_id" value="1" required>
            </div>
            
            <div>
                <label>Image Type:</label>
                <select id="image_type">
                    <option value="gallery">Gallery Image</option>
                    <option value="featured">Featured Image</option>
                </select>
            </div>
            
            <div>
                <label>Caption (optional):</label>
                <input type="text" id="caption" placeholder="Describe this image...">
            </div>
            
            <div>
                <label>Select Image File:</label>
                <input type="file" id="image" accept="image/*" required>
            </div>
            
            <button type="submit">Upload Image</button>
        </form>
        
        <div id="result" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = '<p>⏳ Uploading...</p>';
            
            const formData = new FormData();
            formData.append('venue_id', document.getElementById('venue_id').value);
            formData.append('image_type', document.getElementById('image_type').value);
            formData.append('caption', document.getElementById('caption').value);
            formData.append('image', document.getElementById('image').files[0]);
            
            // Get CSRF token from cookie or session
            const cookies = document.cookie.split(';');
            let csrfToken = '';
            for (let cookie of cookies) {
                if (cookie.trim().startsWith('csrf_token=')) {
                    csrfToken = cookie.trim().substring('csrf_token='.length);
                }
            }
            if (csrfToken) {
                formData.append('csrf_token', csrfToken);
            }
            
            console.log('Uploading to: /admin/images/venues/upload');
            console.log('Venue ID:', formData.get('venue_id'));
            console.log('Image Type:', formData.get('image_type'));
            console.log('Image File:', formData.get('image').name);
            
            try {
                const response = await fetch('/admin/images/venues/upload', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                try {
                    const data = JSON.parse(text);
                    
                    if (data.success) {
                        resultDiv.className = 'success';
                        resultDiv.innerHTML = `
                            <h3>✅ Success!</h3>
                            <p>${data.message}</p>
                            <p><strong>Image ID:</strong> ${data.image.id}</p>
                            <p><strong>Path:</strong> ${data.image.path}</p>
                            <p><strong>URL:</strong> <a href="${data.image.url}" target="_blank">${data.image.url}</a></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    } else {
                        resultDiv.className = 'error';
                        resultDiv.innerHTML = `
                            <h3>❌ Upload Failed</h3>
                            <p>${data.message}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    }
                } catch (e) {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `
                        <h3>❌ Invalid JSON Response</h3>
                        <p>Server returned non-JSON response</p>
                        <pre>${text.substring(0, 1000)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
